<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            backdrop-filter: blur(8px);
        }
        input:focus {
            outline: none !important;
            border-color: transparent !important;
            box-shadow: 0 0 0 3px #E1BEE7;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#ecdeee",
                    "surface": "#fff7fc",
                    "on-surface-variant": "#504251",
                    "primary-fixed-dim": "#f3aeff",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#e8c4ee",
                    "surface-container-low": "#fdefff",
                    "surface-dim": "#e3d6e5",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#f5b7fe",
                    "on-surface": "#201924",
                    "secondary-fixed": "#fdd6ff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#942cb0",
                    "primary-fixed": "#fdd6ff",
                    "secondary-fixed-dim": "#efb1f9",
                    "secondary": "#7e4a8a",
                    "on-tertiary-fixed-variant": "#583d5f",
                    "inverse-on-surface": "#faecfc",
                    "on-secondary-container": "#754281",
                    "inverse-primary": "#f3aeff",
                    "surface-container": "#f8e9fa",
                    "on-primary-fixed": "#340042",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#f2e4f4",
                    "tertiary-fixed-dim": "#debbe4",
                    "primary-container": "#8e24aa",
                    "on-primary-container": "#f7bcff",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#fad7ff",
                    "primary": "#70008b",
                    "outline-variant": "#d3c1d2",
                    "on-secondary-fixed-variant": "#643370",
                    "on-tertiary-fixed": "#291231",
                    "surface-variant": "#ecdeee",
                    "on-background": "#201924",
                    "error": "#ba1a1a",
                    "tertiary": "#523859",
                    "error-container": "#ffdad6",
                    "surface-bright": "#fff7fc",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#790096",
                    "outline": "#827282",
                    "inverse-surface": "#362e39",
                    "tertiary-container": "#6b4f72",
                    "background": "#fff7fc",
                    "on-secondary-fixed": "#340141"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-safe": "32px",
                    "max-width": "1280px",
                    "stack-md": "2rem",
                    "stack-xs": "0.5rem",
                    "stack-sm": "1rem",
                    "stack-lg": "4rem",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "button-text": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "button-text": ["20px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-lg": ["18px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-surface-container rounded-full opacity-60 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary-container rounded-full opacity-40 blur-[120px]"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[480px] px-stack-sm animate-fade-in">
<!-- Brand Identity Section -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center p-stack-sm bg-primary-container rounded-xl mb-stack-sm shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-[48px]" data-icon="dentistry">dentistry</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">OdontoApp</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-xs opacity-80">Portal do Profissional</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant p-stack-md rounded-xl login-card">
<form action="#" class="space-y-stack-md">
<!-- Large Password Field -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-lg text-label-lg text-on-surface ml-1" for="password">Digite sua Senha</label>
<div class="relative group">
<input class="w-full h-20 px-6 font-body-lg text-body-lg bg-surface border-[1.5px] border-outline-variant rounded-lg transition-all focus:border-primary placeholder:opacity-30 text-center tracking-[0.5em]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-on-surface-variant opacity-40">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
</div>
</div>
<!-- Enormous Button -->
<button class="w-full h-20 bg-primary text-on-primary font-button-text text-button-text rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] shadow-md flex items-center justify-center gap-3" type="submit">
                    Entrar
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Discret Link -->
<div class="text-center pt-stack-sm">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors decoration-1 underline-offset-4 hover:underline" href="#">
                        Esqueci minha senha
                    </a>
</div>
</form>
</div>
<!-- Footer Visual Hint -->
<div class="mt-stack-lg text-center">
<div class="w-full flex justify-center gap-4 opacity-50">
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="w-2 h-2 rounded-full bg-outline"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-4 text-[14px]">Sistema de Gestão Clínica v2.4.0</p>
</div>
</main>
<script>
        // Micro-interaction for the password field to show symbols while typing
        const passwordInput = document.getElementById('password');
        
        passwordInput.addEventListener('focus', () => {
            passwordInput.parentElement.classList.add('scale-[1.02]');
        });

        passwordInput.addEventListener('blur', () => {
            passwordInput.parentElement.classList.remove('scale-[1.02]');
        });

        // Simple button active state animation handler
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('opacity-80'));
            btn.addEventListener('mouseup', () => btn.classList.remove('opacity-80'));
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body></html>
