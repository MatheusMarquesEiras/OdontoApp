<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff7fc;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .selection-card:active {
            transform: scale(0.98);
        }
        .selection-card:hover .icon-bg {
            background-color: #f5b7fe;
            transform: scale(1.1);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar (Shared Component Context) -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-margin-safe h-20 max-w-max-width mx-auto">
<div class="flex items-center gap-stack-xs">
<span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">OdontoApp</span>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 px-4 py-2 text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-xl font-label-lg text-label-lg" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span>Voltar</span>
</button>
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-safe py-stack-lg">
<div class="max-w-4xl w-full">
<!-- Question Header -->
<div class="text-center mb-stack-lg animate-fade-in">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Novo Prontuário</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Este paciente é <span class="font-bold text-primary">ADULTO</span> ou <span class="font-bold text-primary">CRIANÇA</span>?</p>
</div>
<!-- Bento Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Adult Selection Button -->
<button class="selection-card group relative bg-surface-container-lowest border border-outline-variant p-10 rounded-[2rem] flex flex-col items-center justify-center transition-all duration-300 hover:border-primary hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-primary/20" onclick="handleSelection('adulto')">
<div class="icon-bg w-32 h-32 mb-8 bg-surface-container rounded-full flex items-center justify-center transition-all duration-500">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="person">person</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">ADULTO</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-4 text-center">Ficha clínica completa para pacientes acima de 12 anos.</p>
<div class="mt-8 flex items-center gap-2 text-primary font-label-lg opacity-0 group-hover:opacity-100 transition-opacity">
<span>Selecionar</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Child Selection Button -->
<button class="selection-card group relative bg-surface-container-lowest border border-outline-variant p-10 rounded-[2rem] flex flex-col items-center justify-center transition-all duration-300 hover:border-primary hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-primary/20" onclick="handleSelection('crianca')">
<div class="icon-bg w-32 h-32 mb-8 bg-surface-container rounded-full flex items-center justify-center transition-all duration-500">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="child_care">child_care</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">CRIANÇA</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-4 text-center">Odontopediatria com anamnese lúdica e focada.</p>
<div class="mt-8 flex items-center gap-2 text-primary font-label-lg opacity-0 group-hover:opacity-100 transition-opacity">
<span>Selecionar</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
<!-- Context Hint -->
<div class="mt-stack-lg text-center">
<div class="inline-flex items-center gap-3 px-6 py-3 bg-surface-container-low rounded-full text-on-surface-variant border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]" data-icon="info">info</span>
<span class="font-label-lg text-label-lg">A seleção define os campos obrigatórios do formulário.</span>
</div>
</div>
</div>
</main>
<!-- Illustrative Background Element -->
<div class="fixed bottom-0 left-0 w-full h-1/3 opacity-20 pointer-events-none z-[-1]">
<div class="w-full h-full bg-cover bg-bottom opacity-30" data-alt="A subtle and elegant minimalist background for a dental clinic application using a soft lilac and lavender color palette. The composition features smooth, flowing abstract shapes and high-key lighting that creates a professional, hygienic, and calming medical environment. The visual style is modern, minimalist, and extremely clean, reflecting a high-end clinical experience without being cold or sterile." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCptMGLp5ERoXm6bfU1eWl8G-4ZMxP2B27fBO6_EehrcNv_zm7tpM44rEWsQEx5Ddn_v36Ukhvqo14zdOieZtY5CFZQDm8i4X_uJTydPdCI5l9QiyTzqoKffg4-KqZQ2Q9oHd1GVlm96YhrqhczAKnD-zv3b401Upze3WKtL3fi6QxuB7I_likHn0BSZKNOio9UoEayXz5y5Y-T84xh8SS73_1oXkySWPHeVyD4KrSrfBPiFodtjL-i0E_jwz_uXmNi-zpIr_MjYXfW')"></div>
</div>
<!-- Micro-interactions Script -->
<script>
        function handleSelection(type) {
            console.log('Selecionado:', type);
            // Visual feedback before navigation
            const cards = document.querySelectorAll('.selection-card');
            cards.forEach(card => {
                card.style.opacity = '0.5';
                card.style.transform = 'scale(0.95)';
            });
            
            // Highlight chosen one
            const selected = event.currentTarget;
            selected.style.opacity = '1';
            selected.style.transform = 'scale(1.05)';
            selected.classList.add('ring-4', 'ring-primary');

            // Success feedback toast simulation
            const msg = document.createElement('div');
            msg.className = 'fixed top-10 left-1/2 -translate-x-1/2 bg-primary text-on-primary px-8 py-4 rounded-full font-label-lg shadow-xl animate-bounce';
            msg.innerHTML = `Processando formulário de ${type}...`;
            document.body.appendChild(msg);

            // Redirect delay
            setTimeout(() => {
                // In a real app: window.location.href = `/formulario/${type}`;
                alert(`Iniciando formulário para: ${type.toUpperCase()}`);
                location.reload();
            }, 1000);
        }
    </script>
</body></html>
