[package]
name = "odontoapp"
version = "1.0.0"
description = "OdontoApp — registro de pacientes para clínica odontológica"
authors = ["Matheus Marques"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "odontoapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Banco local. `bundled` compila o SQLite do código-fonte (só precisa do MSVC).
# Para trocar por SQLCipher (cifra o arquivo inteiro) no futuro: use a feature
# "bundled-sqlcipher-vendored-openssl" e defina `PRAGMA key` ao abrir a conexão.
rusqlite = { version = "0.32", features = ["bundled"] }
# Criptografia dos dados sensíveis, pura em Rust (sem OpenSSL):
argon2 = "0.5"                 # derivação de chave a partir da senha / chave de recuperação
chacha20poly1305 = "0.10"      # AEAD para "embrulhar" a chave-mestra e cifrar os registros
rand = "0.8"                   # bytes aleatórios (chave-mestra, salts, nonces)
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

